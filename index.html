<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Табель">
    <meta name="theme-color" content="#C8102E">
    <title>Табель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=PT+Sans:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #C8102E;
            --red-dark: #8E0B21;
            --steel: #6B7280;
            --steel-dark: #3F4448;
            --board: #14171A;
            --board-line: rgba(255,255,255,0.09);
            --amber: #FFB300;
            --paper: #F1F0EB;
            --card: #FFFFFF;
            --ink: #1B1E22;
            --ink-soft: #5B6066;
            --line: rgba(27,30,34,0.13);
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'PT Sans', sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
        }
        .wrap {
            max-width: 460px;
            margin: 0 auto;
            padding: 0 16px;
        }
        .rail-header {
            background: var(--red);
            padding: 16px 16px 14px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .rail-header-inner {
            max-width: 460px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-mark {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.06em;
            color: var(--red);
            background: #fff;
            border-radius: 3px;
            padding: 3px 6px;
            line-height: 1.2;
        }
        .brand h1 {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: 0.03em;
            margin: 0;
            text-transform: uppercase;
            color: #fff;
        }
        .brand .sub {
            display: block;
            font-family: 'PT Sans', sans-serif;
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 1px;
            letter-spacing: 0.01em;
        }
        .month-select {
            font-family: 'PT Sans', sans-serif;
            font-weight: 700;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            text-align: right;
            border-radius: 4px;
            padding: 5px 8px;
        }
        .month-select option {
            color: var(--ink);
        }
        .rail-stripe {
            height: 6px;
            background: repeating-linear-gradient(45deg, var(--steel-dark) 0 10px, #fff 10px 20px);
        }
        .wrap {
            padding-top: 20px;
        }
        .total-card {
            background: var(--board);
            border-radius: 4px;
            padding: 16px 18px 14px;
            margin-bottom: 20px;
            box-shadow: 0 6px 18px rgba(20, 23, 26, 0.25);
        }
        .total-card .label {
            font-family: 'Oswald', sans-serif;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--steel);
            font-weight: 500;
            margin-bottom: 10px;
        }
        .role-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid var(--board-line);
            gap: 8px;
        }
        .role-row .rname {
            font-family: 'PT Sans', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: #E8E6E0;
            flex: 1;
        }
        .role-row .rrate {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: var(--steel);
            background: none;
            border: none;
            border-bottom: 1px dashed var(--steel);
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
        }
        .role-row .rrate input {
            width: 50px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            border: none;
            border-bottom: 1px solid var(--amber);
            background: transparent;
            color: var(--amber);
            padding: 0;
        }
        .role-row .rhrs {
            font-family: 'Share Tech Mono', monospace;
            font-weight: 400;
            font-size: 15px;
            width: 80px;
            text-align: right;
            flex-shrink: 0;
            color: var(--amber);
            letter-spacing: 0.02em;
        }
        .role-row .rpay {
            font-family: 'Share Tech Mono', monospace;
            font-weight: 400;
            font-size: 15px;
            color: var(--amber);
            width: 92px;
            text-align: right;
            flex-shrink: 0;
            letter-spacing: 0.02em;
        }
        .grand-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--steel-dark);
        }
        .grand-row .glabel {
            font-family: 'Oswald', sans-serif;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--steel);
        }
        .grand-row .gval {
            font-family: 'Share Tech Mono', monospace;
            font-weight: 400;
            font-size: 26px;
            color: var(--amber);
        }
        .grand-row .gpay {
            font-family: 'Share Tech Mono', monospace;
            font-weight: 400;
            font-size: 22px;
            color: var(--amber);
            margin-left: 12px;
        }
        .role-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }
        .role-toggle button {
            flex: 1;
            padding: 10px 8px;
            border-radius: 3px;
            border: 1.5px solid var(--steel);
            background: var(--card);
            font-family: 'PT Sans', sans-serif;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--ink);
            cursor: pointer;
        }
        .role-toggle button.sel {
            background: var(--red);
            color: #fff;
            border-color: var(--red-dark);
        }
        .stamp-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 8px 0 28px;
        }
        .stamp-btn {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            border: 4px solid var(--steel-dark);
            background: var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 12.5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #fff;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            position: relative;
            box-shadow: 0 4px 14px rgba(200, 16, 46, 0.35);
        }
        .stamp-btn:active {
            transform: scale(0.94);
        }
        .stamp-btn.active {
            background: var(--steel-dark);
            border-color: var(--amber);
            box-shadow: 0 4px 14px rgba(255, 179, 0, 0.3);
        }
        .stamp-btn .time {
            font-family: 'Share Tech Mono', monospace;
            font-weight: 400;
            font-size: 19px;
            margin-top: 4px;
            letter-spacing: 0.02em;
            color: var(--amber);
        }
        .stamp-hint {
            margin-top: 12px;
            font-size: 12.5px;
            color: var(--ink-soft);
            font-family: 'PT Sans', sans-serif;
            text-align: center;
        }
        .stamp-flash {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 3px solid var(--amber);
            opacity: 0;
            pointer-events: none;
        }
        .stamp-flash.play {
            animation: stampPulse 0.5s ease-out;
        }
        @keyframes stampPulse {
            0% {
                opacity: 0.9;
                transform: scale(0.9);
            }
            100% {
                opacity: 0;
                transform: scale(1.35);
            }
        }
        .section-label {
            font-family: 'Oswald', sans-serif;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin: 0 0 10px 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--line);
        }
        .entry {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 10px;
            margin-bottom: 6px;
            background: var(--card);
            border-left: 3px dashed var(--steel);
            border-radius: 2px;
            font-size: 14px;
            box-shadow: 0 1px 2px rgba(27, 30, 34, 0.06);
        }
        .entry .date {
            width: 56px;
            flex-shrink: 0;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--ink-soft);
            line-height: 1.3;
        }
        .entry .rbadge {
            flex-shrink: 0;
            font-family: 'Oswald', sans-serif;
            font-size: 10px;
            font-weight: 600;
            padding: 3px 6px;
            border-radius: 3px;
            background: var(--red);
            color: #fff;
            white-space: nowrap;
            letter-spacing: 0.03em;
        }
        .entry .times {
            flex: 1;
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
        }
        .entry .times .open {
            color: var(--red);
            font-weight: 700;
        }
        .entry .dur {
            font-family: 'Share Tech Mono', monospace;
            font-weight: 400;
            font-size: 13.5px;
            color: var(--steel-dark);
            width: 58px;
            text-align: right;
            flex-shrink: 0;
        }
        .entry .actions {
            display: flex;
            gap: 0;
            flex-shrink: 0;
        }
        .entry .actions button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 5px;
            color: var(--ink-soft);
            font-size: 14px;
            line-height: 1;
        }
        .entry .actions button:hover {
            color: var(--red);
        }
        .empty {
            text-align: center;
            padding: 30px 10px;
            color: var(--ink-soft);
            font-size: 13.5px;
            font-family: 'PT Sans', sans-serif;
        }
        .add-btn {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background: transparent;
            border: 1.5px dashed var(--steel);
            border-radius: 3px;
            color: var(--ink-soft);
            font-family: 'PT Sans', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        .add-btn:hover {
            border-color: var(--red);
            color: var(--red);
        }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(20, 23, 26, 0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 50;
        }
        .modal {
            background: var(--paper);
            width: 100%;
            max-width: 460px;
            border-radius: 12px 12px 0 0;
            padding: 20px 20px 26px;
            border-top: 4px solid var(--red);
        }
        .modal h2 {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 17px;
            margin: 0 0 14px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .field {
            margin-bottom: 12px;
        }
        .field label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink-soft);
            margin-bottom: 4px;
            font-family: 'Oswald', sans-serif;
        }
        .field input,
        .field select {
            width: 100%;
            padding: 9px 10px;
            font-size: 14px;
            font-family: 'PT Sans', sans-serif;
            border: 1.5px solid var(--ink);
            border-radius: 4px;
            background: #fff;
            color: var(--ink);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .modal-actions button {
            flex: 1;
            padding: 11px;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'PT Sans', sans-serif;
            font-weight: 700;
            cursor: pointer;
            border: 1.5px solid var(--ink);
        }
        .btn-cancel {
            background: transparent;
            color: var(--ink);
        }
        .btn-save {
            background: var(--red);
            color: #fff;
            border-color: var(--red-dark);
        }
        .btn-delete {
            background: transparent;
            color: var(--red);
            border-color: var(--red);
        }
        .toast {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--steel-dark);
            color: #fff;
            padding: 9px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-family: 'PT Sans', sans-serif;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 60;
        }
        .toast.show {
            opacity: 1;
        }

        /* Дополнительно для Android WebView */
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Улучшенная кнопка на телефоне */
        .stamp-btn {
            -webkit-tap-highlight-color: transparent;
        }
        .stamp-btn:active {
            transform: scale(0.94);
        }

        /* Фикс для модалки на Android */
        .modal-backdrop {
            padding-bottom: env(safe-area-inset-bottom);
        }

        @media (max-width: 400px) {
            .role-row .rhrs {
                width: 60px;
                font-size: 13px;
            }
            .role-row .rpay {
                width: 75px;
                font-size: 13px;
            }
            .brand h1 {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <div class="rail-header">
        <div class="rail-header-inner">
            <div class="brand">
                <span class="brand-mark">ЖД</span>
                <div>
                    <h1>Табель</h1>
                    <span class="sub">учёт рабочего времени</span>
                </div>
            </div>
            <select class="month-select" id="monthSelect"></select>
        </div>
    </div>
    <div class="rail-stripe"></div>

    <div class="wrap">
        <div class="total-card">
            <div class="label">Отработано</div>
            <div id="roleRows"></div>
            <div class="grand-row">
                <div class="glabel">Итого</div>
                <div style="display:flex; align-items:baseline;">
                    <span class="gval" id="grandHours">0ч 00м</span>
                    <span class="gpay" id="grandPay">0 ₽</span>
                </div>
            </div>
        </div>

        <div class="role-toggle" id="roleToggle"></div>

        <div class="stamp-zone">
            <button class="stamp-btn" id="stampBtn">
                <div class="stamp-flash" id="stampFlash"></div>
                <span id="stampLabel">Начать смену</span>
                <span class="time" id="stampTime"></span>
            </button>
            <div class="stamp-hint" id="stampHint">не в смене</div>
        </div>

        <div class="section-label">Записи</div>
        <div id="entryList"></div>

        <button class="add-btn" id="addBtn">+ Добавить запись вручную</button>
    </div>

    <div id="modalRoot"></div>
    <div class="toast" id="toast"></div>

    <script>
        const DOW = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
        const MONTHS_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь',
            'Декабрь'
        ];

        const ROLES = [
            { id: 'driver', name: 'Машинист', badge: 'МАШ' },
            { id: 'assistant', name: 'Помощник машиниста', badge: 'ПОМ' }
        ];

        let entries = [];
        let rates = { driver: 379.79, assistant: 262.34 };
        let currentRole = 'driver';
        let selectedMonthKey = monthKey(new Date());
        let tickInterval = null;

        function monthKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }

        function pad(n) { return String(n).padStart(2, '0'); }

        function fmtDur(ms) {
            const totalMin = Math.max(0, Math.round(ms / 60000));
            return Math.floor(totalMin / 60) + 'ч ' + pad(totalMin % 60) + 'м';
        }

        function fmtTime(iso) {
            const d = new Date(iso);
            return pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function fmtDateShort(iso) {
            const d = new Date(iso);
            return DOW[d.getDay()] + ' ' + d.getDate() + '.' + pad(d.getMonth() + 1);
        }

        function fmtMoney(n) {
            const parts = n.toFixed(2).split('.');
            return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + parts[1] + ' ₽';
        }

        function roleInfo(id) { return ROLES.find(r => r.id === id) || ROLES[0]; }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1800);
        }

        async function loadEntries() {
            try {
                const raw = localStorage.getItem('work-entries');
                entries = raw ? JSON.parse(raw) : [];
                entries.forEach(e => { if (!e.role) e.role = 'driver'; });
            } catch (e) {
                entries = [];
            }
        }

        async function saveEntries() {
            try {
                localStorage.setItem('work-entries', JSON.stringify(entries));
            } catch (e) {
                toast('Ошибка сохранения');
            }
        }

        async function loadRates() {
            try {
                const raw = localStorage.getItem('work-rates');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    rates = { driver: parsed.driver || 379.79, assistant: parsed.assistant || 262.34 };
                }
            } catch (e) { /* keep defaults */ }
        }

        async function saveRates() {
            try {
                localStorage.setItem('work-rates', JSON.stringify(rates));
            } catch (e) {
                toast('Ошибка сохранения ставки');
            }
        }

        function activeEntry() {
            return entries.find(e => !e.end);
        }

        function buildMonthOptions() {
            const sel = document.getElementById('monthSelect');
            const keys = new Set(entries.map(e => e.start.slice(0, 7)));
            keys.add(monthKey(new Date()));
            const sorted = Array.from(keys).sort().reverse();
            sel.innerHTML = '';
            sorted.forEach(k => {
                const [y, m] = k.split('-');
                const opt = document.createElement('option');
                opt.value = k;
                opt.textContent = MONTHS_NOM[parseInt(m) - 1] + ' ' + y;
                if (k === selectedMonthKey) opt.selected = true;
                sel.appendChild(opt);
            });
        }

        function monthEntriesFor() {
            return entries.filter(e => e.start.slice(0, 7) === selectedMonthKey);
        }

        function msFor(e) {
            const end = e.end || new Date().toISOString();
            return new Date(end) - new Date(e.start);
        }

        function renderTotal() {
            const monthEntries = monthEntriesFor();
            const rowsEl = document.getElementById('roleRows');
            rowsEl.innerHTML = '';

            let grandMs = 0,
                grandPay = 0;
            ROLES.forEach(role => {
                const roleMs = monthEntries
                    .filter(e => e.role === role.id)
                    .reduce((sum, e) => sum + msFor(e), 0);
                const roleHours = roleMs / 3600000;
                const rolePay = roleHours * rates[role.id];
                grandMs += roleMs;
                grandPay += rolePay;

                const row = document.createElement('div');
                row.className = 'role-row';
                row.innerHTML = `
                    <div class="rname">${role.name}</div>
                    <button class="rrate" data-role="${role.id}">${rates[role.id]} ₽/ч ✎</button>
                    <div class="rhrs">${fmtDur(roleMs)}</div>
                    <div class="rpay">${fmtMoney(rolePay)}</div>
                `;
                rowsEl.appendChild(row);
            });

            document.getElementById('grandHours').textContent = fmtDur(grandMs);
            document.getElementById('grandPay').textContent = fmtMoney(grandPay);

            rowsEl.querySelectorAll('.rrate').forEach(btn => {
                btn.addEventListener('click', () => editRate(btn));
            });
        }

        function editRate(btn) {
            const roleId = btn.dataset.role;
            const current = rates[roleId];
            btn.outerHTML =
                `<span class="rrate" id="rateInputWrap-${roleId}"><input type="number" min="0" step="1" value="${current}" id="rateInput-${roleId}">&nbsp;₽/ч</span>`;
            const input = document.getElementById('rateInput-' + roleId);
            input.focus();
            input.select();
            const commit = async () => {
                const val = parseFloat(input.value);
                rates[roleId] = (!isNaN(val) && val >= 0) ? val : current;
                await saveRates();
                renderTotal();
            };
            input.addEventListener('blur', commit, { once: true });
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
        }

        function renderRoleToggle() {
            const el = document.getElementById('roleToggle');
            el.innerHTML = '';
            ROLES.forEach(role => {
                const btn = document.createElement('button');
                btn.textContent = role.name;
                if (role.id === currentRole) btn.classList.add('sel');
                btn.addEventListener('click', () => {
                    if (activeEntry()) {
                        toast('Сначала завершите текущую смену');
                        return;
                    }
                    currentRole = role.id;
                    renderRoleToggle();
                });
                el.appendChild(btn);
            });
        }

        function renderStamp() {
            const active = activeEntry();
            const btn = document.getElementById('stampBtn');
            const label = document.getElementById('stampLabel');
            const timeEl = document.getElementById('stampTime');
            const hint = document.getElementById('stampHint');
            const toggle = document.getElementById('roleToggle');

            if (active) {
                btn.classList.add('active');
                label.textContent = 'Закончить';
                hint.textContent = roleInfo(active.role).name + ' · с ' + fmtTime(active.start);
                toggle.style.opacity = '0.45';
                toggle.style.pointerEvents = 'none';
                updateTick();
                if (!tickInterval) tickInterval = setInterval(updateTick, 1000);
            } else {
                btn.classList.remove('active');
                label.textContent = 'Начать смену';
                timeEl.textContent = '';
                hint.textContent = 'не в смене';
                toggle.style.opacity = '1';
                toggle.style.pointerEvents = 'auto';
                if (tickInterval) { clearInterval(tickInterval);
                    tickInterval = null; }
            }
        }

        function updateTick() {
            const active = activeEntry();
            if (!active) return;
            const ms = new Date() - new Date(active.start);
            const totalSec = Math.floor(ms / 1000);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            document.getElementById('stampTime').textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
        }

        function renderList() {
            const list = document.getElementById('entryList');
            const monthEntries = monthEntriesFor().sort((a, b) => new Date(b.start) - new Date(a.start));

            if (monthEntries.length === 0) {
                list.innerHTML =
                    '<div class="empty">Пока нет записей в этом месяце.<br>Нажмите «Начать смену» или добавьте запись вручную.</div>';
                return;
            }

            list.innerHTML = '';
            monthEntries.forEach(e => {
                const row = document.createElement('div');
                row.className = 'entry';
                const dur = e.end ? fmtDur(new Date(e.end) - new Date(e.start)) : '—';
                const timesHtml = e.end ?
                    fmtTime(e.start) + '–' + fmtTime(e.end) :
                    fmtTime(e.start) + '–<span class="open">сейчас</span>';
                row.innerHTML = `
                    <div class="date">${fmtDateShort(e.start)}</div>
                    <div class="rbadge">${roleInfo(e.role).badge}</div>
                    <div class="times">${timesHtml}</div>
                    <div class="dur">${dur}</div>
                    <div class="actions">
                        <button data-edit="${e.id}" title="Изменить">✎</button>
                        <button data-del="${e.id}" title="Удалить">✕</button>
                    </div>
                `;
                list.appendChild(row);
            });

            list.querySelectorAll('[data-edit]').forEach(btn => {
                btn.addEventListener('click', () => openEditModal(btn.dataset.edit));
            });
            list.querySelectorAll('[data-del]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    entries = entries.filter(e => e.id !== btn.dataset.del);
                    await saveEntries();
                    renderAll();
                    toast('Запись удалена');
                });
            });
        }

        function renderAll() {
            buildMonthOptions();
            renderTotal();
            renderRoleToggle();
            renderStamp();
            renderList();
        }

        function toLocalInputValue(iso) {
            const d = new Date(iso);
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d
                .getMinutes());
        }

        function openEditModal(id) {
            const entry = id ? entries.find(e => e.id === id) : null;
            const now = new Date();
            const defaultStart = entry ? toLocalInputValue(entry.start) : toLocalInputValue(now.toISOString());
            const roleOptionsHtml = ROLES.map(r =>
                `<option value="${r.id}" ${((entry ? entry.role : currentRole) === r.id) ? 'selected' : ''}>${r.name}</option>`
            ).join('');

            const root = document.getElementById('modalRoot');
            root.innerHTML = `
                <div class="modal-backdrop" id="backdrop">
                    <div class="modal">
                        <h2>${entry ? 'Изменить запись' : 'Добавить запись'}</h2>
                        <div class="field">
                            <label>Должность</label>
                            <select id="roleInput">${roleOptionsHtml}</select>
                        </div>
                        <div class="field">
                            <label>Начало</label>
                            <input type="datetime-local" id="startInput" value="${defaultStart}">
                        </div>
                        <div class="field">
                            <label>Окончание (можно оставить пустым)</label>
                            <input type="datetime-local" id="endInput" value="${entry && entry.end ? toLocalInputValue(entry.end) : ''}">
                        </div>
                        <div class="modal-actions">
                            <button class="btn-cancel" id="cancelBtn">Отмена</button>
                            <button class="btn-save" id="saveBtn">Сохранить</button>
                        </div>
                        ${entry ? '<div class="modal-actions"><button class="btn-delete" id="deleteBtn" style="width:100%">Удалить запись</button></div>' : ''}
                    </div>
                </div>
            `;

            document.getElementById('backdrop').addEventListener('click', (e) => {
                if (e.target.id === 'backdrop') closeModal();
            });
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('saveBtn').addEventListener('click', async () => {
                const startVal = document.getElementById('startInput').value;
                const endVal = document.getElementById('endInput').value;
                const roleVal = document.getElementById('roleInput').value;
                if (!startVal) { toast('Укажите время начала'); return; }
                const startISO = new Date(startVal).toISOString();
                const endISO = endVal ? new Date(endVal).toISOString() : null;
                if (endISO && new Date(endISO) <= new Date(startISO)) {
                    toast('Окончание должно быть позже начала');
                    return;
                }
                if (entry) {
                    entry.start = startISO;
                    entry.end = endISO;
                    entry.role = roleVal;
                } else {
                    entries.push({ id: 'e' + Date.now(), start: startISO, end: endISO, role: roleVal });
                }
                await saveEntries();
                closeModal();
                renderAll();
                toast('Сохранено');
            });
            const delBtn = document.getElementById('deleteBtn');
            if (delBtn) {
                delBtn.addEventListener('click', async () => {
                    entries = entries.filter(e2 => e2.id !== entry.id);
                    await saveEntries();
                    closeModal();
                    renderAll();
                    toast('Запись удалена');
                });
            }
        }

        function closeModal() {
            document.getElementById('modalRoot').innerHTML = '';
        }

        document.getElementById('stampBtn').addEventListener('click', async () => {
            const active = activeEntry();
            const flash = document.getElementById('stampFlash');
            flash.classList.remove('play');
            void flash.offsetWidth;
            flash.classList.add('play');

            if (active) {
                active.end = new Date().toISOString();
                await saveEntries();
                toast('Смена закончена');
            } else {
                entries.push({ id: 'e' + Date.now(), start: new Date().toISOString(), end: null, role: currentRole });
                await saveEntries();
                toast('Смена начата · ' + roleInfo(currentRole).name);
            }
            renderAll();
        });

        document.getElementById('monthSelect').addEventListener('change', (e) => {
            selectedMonthKey = e.target.value;
            renderTotal();
            renderList();
        });

        document.getElementById('addBtn').addEventListener('click', () => openEditModal(null));

        (async function init() {
            await loadEntries();
            await loadRates();
            renderAll();
        })();
    </script>
</body>
</html>
